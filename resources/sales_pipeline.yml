resources:
  jobs:
    sales_pipeline:
      name: sales_pipeline
      parameters:
        - name: batch_ts
          default: "{{job.trigger.time.iso_datetime}}"
      tasks:
        - task_key: bronze
          sql_task:
            file:
              path: ../source/bronze_sales_transactions.sql
            warehouse_id: 651ec3cd85cc86a4
            parameters:
              batch_ts: "{{job.parameters.batch_ts}}"

        - task_key: silver
          depends_on:
            - task_key: bronze
          sql_task:
            file:
              path: ../source/silver_sales_transactions.sql
            warehouse_id: 651ec3cd85cc86a4
            parameters:
              batch_ts: "{{job.parameters.batch_ts}}"